name: collector

# Reads new tokens from the chain and GeckoTerminal into the Cloudflare D1 database, every 5 minutes.
# GitHub may start a run a few minutes late; the chain cursor catches up, so nothing is skipped.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One run at a time: two overlapping runs would both read the same blocks.
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # A catch-up run after a long GitHub delay reads many blocks and contracts; a normal run takes about a minute.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the collector
        run: node collector/run-ci.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RPC_URL: ${{ secrets.RPC_URL }}
          LOGS_RPC_URL: ${{ secrets.LOGS_RPC_URL }}
